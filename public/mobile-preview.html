<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手機介面模擬 — 戰報互動規則</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #1a1a1e;
        color: #f2f2f2;
        font-family: "Segoe UI", "Noto Sans TC", sans-serif;
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        opacity: 0.9;
      }
      .hint {
        margin: 0;
        font-size: 0.82rem;
        opacity: 0.65;
      }
      .phone {
        width: 390px;
        max-width: calc(100vw - 24px);
        height: min(844px, calc(100vh - 88px));
        border: 10px solid #0d0d10;
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        background: #000;
        position: relative;
      }
      .phone::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 96px;
        height: 8px;
        border-radius: 999px;
        background: #222;
        z-index: 2;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h1>手機介面模擬（390×844）— 戰報互動規則</h1>
    <p class="hint">若未自動開啟，請從選單進入「戰報互動規則」</p>
    <div class="phone">
      <iframe
        title="BOTC mobile preview"
        src="/?open=interactionRules"
      ></iframe>
    </div>
  </body>
</html>
